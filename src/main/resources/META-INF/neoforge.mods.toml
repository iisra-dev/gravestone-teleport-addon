modLoader = "javafml"
loaderVersion = "*"
license = "MIT"
issueTrackerURL = "https://github.com/iisra-dev/gravestone-teleport-addon/issues"

[[mods]]
modId = "gravestone_teleport_addon"
version = "${mod_version}"
displayName = "GraveStone Teleport Addon"
authors = "iisra-dev"
description = '''An addon for the GraveStone mod by Max Henkel (henkelmax).

Lets you charge the obituary item with an Ender Pearl (crafting recipe), showing a glowing
indicator once charged. Right-clicking a charged obituary teleports you back to your grave
and consumes the charge; shift + right-click still opens GraveStone's own death-info GUI.

This addon does not include, modify, or redistribute any GraveStone code or assets - it only
reads the public death-location data GraveStone itself stores on the obituary item. GraveStone
must be installed separately for this addon to do anything.'''

[[dependencies.gravestone_teleport_addon]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.gravestone_teleport_addon]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11,1.21.12)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gravestone_teleport_addon]]
modId = "gravestone"
type = "required"
versionRange = "${gravestone_dependency}"
ordering = "AFTER"
side = "BOTH"
