org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# Minecraft / NeoForge
minecraft_version=26.2
neoforge_version=26.2.0.88
neoforge_dependency=[26.2.0.88,)

java_version=25

# Mod information
mod_id=gravestone_teleport_addon
mod_group_id=dev.iisradev.gravestoneteleportaddon
mod_version=26.2-1.0.0
mod_display_name=GraveStone Teleport Addon
archives_base_name=gravestone_teleport_addon-neoforge

# The GraveStone mod this addon requires (https://github.com/henkelmax/gravestone).
# This is NOT bundled or redistributed - see libs/README.md.
# Starting with Minecraft 26.1, upstream corelib/gravestone switched their versioning to
# "<semver>+<minecraft_version>" (build metadata suffix) instead of the old "<minecraft_version>-<semver>"
# prefix scheme - see the corelib coordinate in build.gradle.
corelib_version=2.1.12
gravestone_dependency=[1.0.40+26.2,)
