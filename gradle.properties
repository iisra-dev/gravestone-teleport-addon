org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# Minecraft / NeoForge
minecraft_version=1.21.11
neoforge_version=21.11.0-beta
neoforge_dependency=[21.11.0-beta,)

java_version=21

# Mod information
mod_id=gravestone_teleport_addon
mod_group_id=dev.iisradev.gravestoneteleportaddon
mod_version=1.21.11-1.0.0
mod_display_name=GraveStone Teleport Addon
archives_base_name=gravestone_teleport_addon-neoforge

# The GraveStone mod this addon requires (https://github.com/henkelmax/gravestone).
# This is NOT bundled or redistributed - see libs/README.md.
# Note: upstream's own 1.21.11 gradle.properties lists corelib_version=2.1.12, but no
# corelib-1.21.11-2.1.12 artifact was ever published (only corelib-1.21.11-2.1.11 exists;
# 2.1.12 only exists as 2.1.12+26.1.2 / 2.1.12+26.2 for the newer branches) - use 2.1.11 here.
corelib_version=2.1.11
gravestone_dependency=[1.21.11-1.0.0,)
