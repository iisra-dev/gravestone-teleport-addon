plugins {
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
    // Publishes de.maxhenkel.corelib, a small utility library used (independently) by both
    // GraveStone and this addon to read/write death records. This is NOT the GraveStone mod.
    maven {
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.corelib'
        }
    }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Real, independently published library - not part of the GraveStone mod jar.
    // Used only to read the same on-disk death records GraveStone itself writes.
    // GraveStone bundles its own private, relocated copy of this library, so we embed our
    // own copy via jarJar (NeoForge's jar-in-jar mechanism) rather than assuming it's present.
    compileOnly "de.maxhenkel.corelib:corelib:${corelib_version}+${minecraft_version}:api"
    jarJar "de.maxhenkel.corelib:corelib:[${corelib_version}+${minecraft_version},3.0.0+${minecraft_version})"

    // The official GraveStone mod jar, compile-time only - used to reference its public
    // registration objects (ObituaryItem, DeathInfo, Main.DEATH_DATA_COMPONENT).
    // Never bundled or redistributed: place your own copy of it here. See libs/README.md.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
    filesMatching('**/*.toml') {
        expand 'mod_version': mod_version,
                'neoforge_dependency': neoforge_dependency,
                'minecraft_version': minecraft_version,
                'gravestone_dependency': gravestone_dependency
    }
}
